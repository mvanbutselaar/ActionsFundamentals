name: GitHub Actions Demo - lab 3

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: "Environment"
        required: true

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Event name: ${{ github.event_name }}"'
      - run: 'echo "Branch name: ${{ github.ref }}"'
      - run: 'echo "Runner info: ${{ toJson(runner) }}"'
      - run: 'echo "Github info: ${{ toJson(github) }}"'
      - run: 'echo "Env info:    ${{ toJson(env) }}"'
      - run: 'echo "Inputs info: ${{ toJson(inputs) }}"'
      - run: 'echo "Job info:    ${{ toJson(job) }}"'
      - run: 'echo "Matrix info: ${{ toJson(matrix) }}"'
      - uses: actions/checkout@v7
      - run: "ls -la"

  Test:
    name: Test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: Build
    environment: Test
    steps:
      - run: echo "Testing..."

  Load-Test:
    name: Load-Test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: Build
    environment: Load-Test
    steps:
      - run: |
          echo "Load Testing..."
          sleep 60

  Production:
    name: Production
    if: github.event.inputs.environment == 'Production'
    runs-on: ubuntu-latest
    needs: [Test, Load-Test]
    environment:
      name: Production
      url: https://writeabout.net
    steps:
      - run: |
          echo "Step 1 deploying Testing..."
          sleep 10
      - run: |
          echo "Step 1 deploying Testing..."
          sleep 10
      - run: |
          echo "Step 1 deploying Testing..."
          sleep 10
      - run: |
          echo "Step 1 deploying Testing..."
          sleep 10
      - run: |
          echo "Step 1 deploying Testing..."
          sleep 10
