name: GitHub Actions Demo

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/**"

  workflow_dispatch:

  schedule:
    - cron: "15 6 * * *"
      timezone: "Europe/Amsterdam"

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - run: 'echo "Event name: ${{ github.event_name }}"'
      - run: 'echo "Branch name: ${{ github.ref }}"'
      - uses: actions/checkout@v7
      - run: "ls -la"
