name: GitHub Actions Demo - lab 4

on:
  workflow_dispatch:

jobs:
  call-workflow:
    name: Call Reusable Workflow
    uses: ./.github/workflows/lab-4-reusable.yml
    with:
      who-to-greet: Marijn

  use-output:
    name: Use Output
    runs-on: ubuntu-latest
    needs: call-workflow
    steps:
      - run: echo "The time we greeted you was ${{ needs.call-workflow.outputs.current-time }}"

  call-and-use:
    name: Call and use Reusable Workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/workflows/lab-4-reusable.yml
        with:
          who-to-greet: Marijn 2
        id: call-and-use
      - run: echo "The time we greeted you was ${{ steps.call-and-use.outputs.current-time }}"
